[package]
name = "cityjson-convert"
version = "0.1.0"
edition = "2021"
authors = ["Balázs Dukai <balazs.dukai@3dgi.nl>", "Ravi Peters <ravi.peters@3dgi.nl>"]
description = "CityJSON format converter"
license = "Apache-2.0"

[[bin]]
name = "cjconvert"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
cityjson-lib = { git = "https://github.com/3DGI/cityjson", branch = "main", features = ["json"] }
clap = { version = "4.6", features = ["cargo", "derive"] }
earcutr = "0.5.0"
env_logger = "0.11.0"
gltf = { version = "1.4", features = ["extensions", "extras"] }
libc = "0.2.119"
log = "0.4"
meshopt = "0.6.2"
num-traits = "0.2.14"
proj-sys = { version = "0.23.1", features = ["network"] }
serde_json = "1.0"
thiserror = "1.0.30"
