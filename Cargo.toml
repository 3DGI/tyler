[package]
name = "tyler"
version = "0.3.14"
edition = "2021"
authors = ["Balázs Dukai <balazs.dukai@3dgi.nl>", "Ravi Peters <ravi.peters@3dgi.nl>"]
description = "Create tiles from 3D city objects encoded as CityJSONFeatures."
repository = "https://github.com/3DGI/tyler"
homepage = "https://github.com/3DGI/tyler"
documentation = "https://github.com/3DGI/tyler"
readme = "README.md"
license = "Apache-2.0"
keywords = ["geo", "cityjson"]
categories = ["command-line-utilities", "science::geo"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "tyler"
path = "src/main.rs"

# [[bin]]
# name = "validate_features"
# path = "validate_features.rs"

# [[bin]]
# name = "find_missing_feature"
# path = "find_missing_feature.rs"

[dependencies]
log = "0.4.17"
env_logger = "0.11.8"
clap = { version = "4.0.32", features = ["cargo", "derive"] }
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.91"
serde_repr = "0.1.10"
walkdir = "2.3.2"
subprocess = "0.2.9"
rayon = "1.6.1"
# crates needed for the proj adaptation
#proj-sys = { version = "0.23.1" , features = ["network"]}
proj-sys = { version = "0.23.1", features = ["network"], path = "proj/proj-sys" }
num-traits = "0.2.14"
libc = "0.2.119"
thiserror = "2.0.17"
bitvec = "1.0.1"
morton-encoding = "2.0.1"
bincode = { version = "2.0.1", features = ["serde"] }
gltf = "1.4"
earcutr = "0.5.0"
anyhow = "1.0"
fcb_core = "0.5"
cjseq2 = "0.1"
flatbuffers = "24.12.23"
reqwest = { version = "0.12", features = ["stream", "blocking", "rustls-tls"], default-features = false }
url = "2.5"
# Object storage support for HTTP/S3 (Priority 3)
# Configure object_store to use rustls (via reqwest) instead of native-tls
object_store = { version = "0.12", features = ["http", "aws"], default-features = false }
# cjseq2 depends on reqwest 0.11 which requires OpenSSL
# Use vendored feature to build OpenSSL from source (no sudo/system packages needed)
openssl-sys = { version = "0.9", features = ["vendored"] }
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "sync"] }
bytes = "1.7"
futures = "0.3"
tempfile = "3.10"
fallible-streaming-iterator = "0.1"
