[package]
name = "tyler"
version = "1.0.0-alpha2"
edition = "2021"
authors = ["Balázs Dukai <balazs.dukai@3dgi.nl>", "Ravi Peters <ravi.peters@3dgi.nl>"]
description = "Create tiles from 3D city objects encoded as CityJSONFeatures."
repository = "https://github.com/3DGI/tyler"
homepage = "https://github.com/3DGI/tyler"
documentation = "https://github.com/3DGI/tyler"
readme = "README.md"
license = "Apache-2.0"
keywords = ["geo", "cityjson"]
categories = ["command-line-utilities", "science::geo"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "tyler"
path = "src/main.rs"

[dependencies]
cityjson-lib = { version = "0.10.0", default-features = false }
cityjson-index = { version = "0.10.0" }
cityjson-convert = { version = "1.0.0-alpha2", default-features = false }
log = "0.4.17"
env_logger = "0.10.0"
clap = { version = "4.0.32", features = ["cargo", "derive"] }
csv = "1"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.91"
serde_repr = "0.1.10"
rayon = "1.6.1"
bitvec = "1.0.1"
morton-encoding = "2.0.1"
bincode = "1.3.3"

[features]
default = ["proj-system"]
proj-system = [
    "cityjson-lib/proj",
    "cityjson-lib/proj-network",
    "cityjson-convert/proj-system",
]
proj-bundled = [
    "cityjson-lib/proj",
    "cityjson-lib/proj-bundled",
    "cityjson-convert/proj-bundled",
]

[dev-dependencies]
rusqlite = "0.37.0"

[workspace]
members = [".", "cityjson-convert"]
resolver = "2"

[patch.crates-io]
cityjson-convert = { path = "cityjson-convert" }
cityjson-lib = { git = "https://github.com/3DGI/cityjson-rs.git", branch = "main" }
cityjson-index = { git = "https://github.com/3DGI/cityjson-rs.git", branch = "main" }
cityjson-types = { git = "https://github.com/3DGI/cityjson-rs.git", branch = "main" }
cityjson-json = { git = "https://github.com/3DGI/cityjson-rs.git", branch = "main" }
